<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>شواهد البحث والتطبيق والمقارنة</title>
<style>
body{margin:0}img{max-width:100%}
/* Layout: short heading block, then the two evidence photos stacked (side by side on wide screens) */
:root{--bg:#f6f4f8;--surface:#fff;--ink:#1d1726;--muted:#6a6175;--plum:#4b2a7b;--gold:#a87b2c;
--body:Tahoma,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15121a;--surface:#211c29;--ink:#eee8f5;--muted:#a69bb4;--plum:#c6a9f2;--gold:#ddb35c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15121a;--surface:#211c29;--ink:#eee8f5;--muted:#a69bb4;--plum:#c6a9f2;--gold:#ddb35c;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{border-bottom:2px solid var(--gold);padding-bottom:12px;display:flex;flex-direction:column;gap:4px}
.school{font-size:13px;color:var(--muted)}
h1{margin:0;font-size:clamp(22px,4vw,30px);color:var(--plum);text-wrap:balance}
dl{margin:0;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px}
dt{color:var(--muted)}dd{margin:0 0 0 0;font-weight:600}
.pair{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:minmax(0,640px);justify-content:center;gap:16px}
figure{margin:0;background:var(--surface);border-radius:8px;overflow:hidden;min-width:0}
figure img{display:block;width:100%;height:auto}
figcaption{padding:8px 12px;font-size:13px;color:var(--muted)}
</style>
</head><body>
<div class="wrap" dir="rtl" lang="ar">
<header>
<span class="school">متوسطة وثانوية علماء الغد</span>
<h1>شواهد تفعيل استراتيجية البحث والتطبيق والمقارنة</h1>
<dl>
<div class="pair"><dt>المادة:</dt><dd>كيمياء</dd></div>
<div class="pair"><dt>الصف:</dt><dd>ثاني ثانوي</dd></div>
<div class="pair"><dt>الدرس:</dt><dd>الرابطة التساهمية</dd></div>
<div class="pair"><dt>تاريخ التنفيذ:</dt><dd>الأحد ٧/٥/١٤٤٨هـ</dd></div>
</dl>
</header>
<section class="grid">
<figure><img src="photo1.jpg" alt="نشاط تحدي اكتشاف مفهوم الرابطة التساهمية معروض على السبورة"><figcaption>نشاط جماعي: تحدي اكتشاف مفهوم الرابطة التساهمية بالبحث والمقارنة</figcaption></figure>
</section>
</div>

</body></html>
