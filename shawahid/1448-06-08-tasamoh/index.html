<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../fonts/amiri.css?v=4">
<title>شواهد اليوم العالمي للتسامح</title>
<style>
body{margin:0}img{max-width:100%}
/* Layout: short heading block, then the two evidence photos stacked (side by side on wide screens) */
:root{--bg:#f6f4f8;--surface:#fff;--ink:#1d1726;--muted:#6a6175;--plum:#4b2a7b;--gold:#a87b2c;
--body:"Fanan","Amiri",serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15121a;--surface:#211c29;--ink:#eee8f5;--muted:#a69bb4;--plum:#c6a9f2;--gold:#ddb35c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15121a;--surface:#211c29;--ink:#eee8f5;--muted:#a69bb4;--plum:#c6a9f2;--gold:#ddb35c;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.9;font-size:19px;font-synthesis:none;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{border-bottom:2px solid var(--gold);padding-bottom:12px;display:flex;flex-direction:column;gap:4px}
.school{font-size:13px;color:var(--muted)}
h1{margin:0;font-size:clamp(22px,4vw,30px);color:var(--plum);text-wrap:balance}
dl{margin:0;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:16px}
dt{color:var(--muted)}dd{margin:0 0 0 0;font-weight:600}
.pair{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
figure{margin:0;background:var(--surface);border-radius:8px;overflow:hidden;min-width:0}
figure img,figure video{display:block;width:100%;height:auto}
figcaption{padding:8px 12px;font-size:15px;color:var(--muted)}
</style>
</head><body>
<div class="wrap" dir="rtl" lang="ar">
<header>
<span class="school">متوسطة وثانوية علماء الغد · حصة النشاط</span>
<h1>شواهد برنامج اليوم العالمي للتسامح</h1>
<dl>
<div class="pair"><dt>مسؤولة التنفيذ:</dt><dd>بشرى العطوي</dd></div>
<div class="pair"><dt>المجال:</dt><dd>المجال الاجتماعي والقيمي</dd></div>
<div class="pair"><dt>عدد المستفيدات:</dt><dd>١٢</dd></div>
<div class="pair"><dt>تاريخ التنفيذ:</dt><dd>الأربعاء ٨/٦/١٤٤٨هـ</dd></div>
</dl>
</header>
<section class="grid">
<figure><video src="video.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video><figcaption>العرض التقديمي عن اليوم العالمي للتسامح</figcaption></figure>
<figure><img src="photo2.jpg" alt="عرض «كن سببًا في نشر المحبة، وابدأ بالتسامح» على السبورة"><figcaption>عرض «كن سببًا في نشر المحبة، وابدأ بالتسامح»</figcaption></figure>
<figure><img src="photo1.jpg" alt="لوحة شجرة التسامح وعليها عبارات الطالبات"><figcaption>لوحة «شجرة التسامح» بعبارات الطالبات</figcaption></figure>
<figure><img src="photo3.jpg" alt="بطاقة بخط طالبة عن التسامح"><figcaption>عبارة كتبتها طالبة: «كن سببًا في نشر المحبة، وابدأ بالتسامح»</figcaption></figure>
<figure><img src="photo4.jpg" alt="ورقة كتبت فيها طالبة عبارة عن التسامح"><figcaption>عبارة طالبة: التسامح من أهم أسباب الصداقة</figcaption></figure>
</section>
</div>

</body></html>
